services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/mabrigverse
      REDIS_URL: redis://redis:6379
      LOCAL_MEDIA_ROOT: /data/media
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      LOCAL_RENDER_ENABLED: "true"
      RENDER_TOKEN: ${RENDER_TOKEN:?Set a random token of at least 32 characters}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      WAN_BRIDGE_ENABLED: ${WAN_BRIDGE_ENABLED:-false}
      WAN_WORKER_URL: ${WAN_WORKER_URL:-http://wan:8080}
      GPU_WORKER_TOKEN: ${GPU_WORKER_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - media-data:/data/media
    depends_on:
      - mongo
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.render
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/mabrigverse
      REDIS_URL: redis://redis:6379
      LOCAL_MEDIA_ROOT: /data/media
      STORAGE_DRIVER: local
      LOCAL_RENDER_ENABLED: "true"
      RENDER_TOKEN: ${RENDER_TOKEN:?Set a random token of at least 32 characters}
      GPU_WORKER_TOKEN: ${GPU_WORKER_TOKEN:-}
      WAN_BRIDGE_ENABLED: ${WAN_BRIDGE_ENABLED:-false}
      WAN_WORKER_URL: ${WAN_WORKER_URL:-http://wan:8080}
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data/media
    depends_on:
      - mongo
      - redis

  # GPU service remains opt-in; use --profile gpu and explicit operator tokens.
  # WAN model downloads and GPU usage consume compute even without API billing.
  wan:
    profiles: ["gpu"]
    build:
      context: ./worker
      dockerfile: Dockerfile.wan
    restart: unless-stopped
    environment:
      GPU_WORKER_TOKEN: ${GPU_WORKER_TOKEN:-}
      GPU_WORKER_PUBLIC_URL: http://wan:8080
      VIDEO_OUTPUT_DIR: /data/outputs
    volumes:
      - wan-data:/data/outputs
      - wan-models:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  mongo-data:
  redis-data:
  media-data:
  wan-data:
  wan-models:
