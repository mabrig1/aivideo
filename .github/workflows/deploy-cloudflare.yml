name: Deploy AI Video to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivideo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy AI Video."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - name: Build Cloudflare Worker
        run: npm run cf:build
      - name: Verify Cloudflare runtime before deployment
        run: npm run cf:smoke
      - name: Deploy reviewed revision
        id: publish
        run: npx wrangler deploy --var "GITHUB_SHA:$GITHUB_SHA"
      # Wrangler can publish workers.dev while reporting a custom-domain conflict.
      # Check the published revision without suppressing that deployment failure.
      - name: Verify published Worker
        if: ${{ !cancelled() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        env:
          CLOUDFLARE_SMOKE_URL: https://aivideo.victoryonline1.workers.dev
        run: npm run cf:smoke
