name: AI Video CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Kaggle bridge contract tests
        run: npm test

      - name: Python notebook uploader syntax
        run: python -m py_compile scripts/kaggle_upload.py

      - name: Next.js build
        run: npm run build

      - name: Cloudflare Worker build
        run: npm run cf:build
